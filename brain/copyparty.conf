# Draft copyparty config for Truck Share. Check option names against the
# copyparty README for the version installed before using it.

[global]
  p: 3923           # port; hostapd/dnsmasq point the captive page here
  e2dsa             # index files so search and the gallery are fast
  e2ts              # read photo and video tags
  qr                # print the page QR at start
  no-robots
  unpost: 0         # guests can't undo (delete) their uploads

% /etc/atlas/copyparty-accounts.conf   # [accounts] owner: <pw>, dash: <pw>; not in git

[/]
  /srv/atlas/share
  accs:
    r: *
    rwmda: owner

[/drop]
  /srv/atlas/share/drop
  accs:
    rw: *
    rwmda: owner

[/private]
  /srv/atlas/share/private
  accs:
    rwmda: owner

[/dash]
  /srv/atlas/share/dash     # DASH handheld syncs its SD card files here (PUT)
  accs:
    w: dash                 # write-only: DASH can upload, not list or delete
    r: *
    rwmda: owner
